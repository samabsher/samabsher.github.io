project:
  type: website
  output-dir: docs
  render:
    - "**/*.qmd"

website:
  title: "Sam Absher"
  site-url: https://samabsher.com
  description: "Sam Absher is an applied microeconomist. Research, data, and replication files."
  favicon: files/favicon.svg
  navbar:
    background: "#FAF7F2"
    foreground: "#1C1917"
    title: "Sam Absher"
    right:
      - text: "Research"
        href: research.qmd
      - text: "Data"
        href: data.qmd
      - text: "CV"
        href: cv.qmd
  page-footer:
    border: false
    background: "#FAF7F2"
    left: "© 2026 Sam Absher"
    right: "Made with [Quarto](https://quarto.org)"

format:
  html:
    theme: [litera, styles/theme.scss]
    toc: false
    anchor-sections: false
    link-external-newwindow: true
    include-in-header:
      text: |
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=Source+Serif+4:ital,opsz,wght@0,8..60,300..700;1,8..60,300..700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
