project:
  type: website
  output-dir: docs
  render:
    - "**/*.qmd"

website:
  title: "Sam Absher"
  site-url: https://samabsher.com
  description: "Sam Absher is an applied microeconomist. Research, data, and replication files."
  favicon: files/favicon.svg
  navbar:
    background: "#FAF7F2"
    foreground: "#1C1917"
    title: "Sam Absher"
    right:
      - text: "Research"
        href: research.qmd
      - text: "Data"
        href: data.qmd
      - text: "CV"
        href: cv.qmd
  page-footer:
    border: false
    background: "#FAF7F2"
    left: "© 2026 Sam Absher"
    right: "Made with [Quarto](https://quarto.org)"

format:
  html:
    theme: [litera, styles/theme.scss]
    toc: false
    anchor-sections: false
    link-external-newwindow: true
    include-in-header:
      text: |
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.2/css/all.min.css">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/academicons@1.9.1/css/academicons.min.css">
